<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GS1 TikTok Data - Callback</title></head>
<body style="font-family:sans-serif;max-width:860px;margin:40px auto;padding:0 16px;line-height:1.6">
<h2>GS1 TikTok Data - Authorization result</h2>
<div id="out">No code in URL.</div>
<p style="color:#666;font-size:13px">Code chỉ sống vài phút và dùng 1 lần. Copy rồi dán ngay vào get_tiktok_token.bat.</p>
<p><a href="terms.html">Terms</a> | <a href="privacy.html">Privacy</a></p>
<script>
  var p = new URLSearchParams(location.search);   // tự decode %2A, %21...
  var out = document.getElementById('out');
  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  if (p.get('error')) {
    out.innerHTML = '<b style="color:#c00">Error:</b> ' + esc(p.get('error')) + '<br>' + esc(p.get('error_description'));
  } else if (p.get('code')) {
    var code = p.get('code');
    out.innerHTML = '<p>State: <b>' + esc(p.get('state')) + '</b> &nbsp; Scopes: ' + esc(p.get('scopes')) + '</p>' +
      '<textarea id="c" readonly style="width:100%;height:110px;font-family:monospace"></textarea><br>' +
      '<button id="b" style="padding:8px 16px;font-size:15px">Copy code</button> <span id="s"></span>';
    var t = document.getElementById('c'); t.value = code;
    document.getElementById('b').onclick = function () {
      t.select();
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).catch(function(){ document.execCommand('copy'); });
      document.getElementById('s').textContent = 'Copied ✓';
    };
  }
</script>
</body></html>
